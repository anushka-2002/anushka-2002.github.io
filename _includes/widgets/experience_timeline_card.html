<article class="experience-timeline-card bg-white shadow-sm rounded-xl p-3 p-md-4">
    <div class="experience-mobile-category small text-muted mb-1">{{ include.category_label }}</div>
    <span class="badge badge-light text-muted font-weight-normal px-2 py-1">{{ include.item.period }}</span>
    <h3 class="h6 mt-2 mb-1">{{ include.item.role }}</h3>
    <div class="small text-muted">{{ include.item.company }}</div>
    <p class="small text-muted mt-2 mb-0 experience-summary">{{ include.item.summary }}</p>
</article>
