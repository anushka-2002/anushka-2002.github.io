research_themes:
  - title: Machine Unlearning & Model Behavior
    question: How can targeted knowledge and behaviours be removed from language models without compromising their broader capabilities? I am interested in post-training and inference-time methods, and in understanding how forgetting manifests in model representations and outputs.
  - title: Reliable Agents & Systems
    question: How can we make complex AI systems reliable across multiple components and long-running interactions? I am interested in agent evaluation, failure analysis, and verification in multi-agent workflows and distributed systems.

