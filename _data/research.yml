- title: "Evaluating Driver Performance from Biosignals in VR Simulation"
  detail_title: "Evaluating Driver Performance from Psychophysiological Signals in VR Simulation"
  slug: vr-driver-performance
  project_url: /research/vr-driver-performance/
  type_badge: Undergraduate Thesis · 2024
  topics:
    - Multimodal ML
    - HCI / Biosignals
  date: 2024-05-01
  pub: Undergraduate Thesis, IIT Kharagpur
  pub_post: " · HCI-BCI Lab · Advised by Prof. Debasis Samanta ·"
  pub_date: "2024"
  abstract: >-
    Built a custom 3-level Unity VR driving simulator and trained a multimodal ML/DL ensemble to evaluate driver performance from predicted performance-shaping factors (attention, anxiety, and mental workload) using synchronized EEG, ECG, and pulse signals across 25 participants.
  cover: /assets/images/research-btp.png
  metadata: B.Tech Thesis, IIT Kharagpur · HCI-BCI Lab · Advised by Prof. Debasis Samanta
  detail_metadata: B.Tech Thesis, IIT Kharagpur · HCI-BCI Lab · Advised by Prof. Debasis Samanta · 2024
  hero_image: /assets/images/btp-hero.png
  problem_heading: "Assessing Cognitive Readiness for Driving"
  problem_paragraphs:
    - >-
      Assessing whether a driver can handle demanding or unexpected situations is difficult using verbal responses and post-task questionnaires alone. A driver may not be able to accurately report changes in their attention, anxiety, or mental workload while navigating a challenging situation. Physiological signals offer another way to assess these factors: rather than relying only on what a driver reports, we can examine changes in brain activity and cardiac signals while they drive. The goal of this project was to explore whether these signals could help estimate a driver's cognitive state and, in turn, provide a more objective assessment of driving performance.
  design_heading: Experimental Design & Multimodal Data Collection
  design_paragraphs:
    - >-
      We built a three-scenario Unity VR driving simulator, with scenarios designed around NASA MATB-II task dimensions. The scenarios introduced progressively more demanding conditions, including turns, rainy roads, construction zones, animal crossings, and unexpected road events.
    - >-
      During each session, we recorded EEG, ECG, and pulse signals to capture participants' physiological responses.
  design_bullets:
    - >-
      <strong>Establishing Ground Truth:</strong> Since the same driving situation can affect different people differently, we did not use scenario difficulty alone to label cognitive states. Mental workload and anxiety were assessed using NASA-TLX and the State-Trait Anxiety Inventory (STAI), while attention labels were derived from the frequency and severity of driving errors.
    - >-
      <strong>Aligning Signals with Driving Events:</strong> The simulator recorded event timestamps, which were used alongside the physiological recordings to associate changes in EEG, ECG, and pulse signals with events during the driving sessions.
  approach_heading: "Two-Stage Approach: From Biosignals to Driver Performance"
  approach_intro: >-
    We approached human performance evaluation in two stages: first estimating the factors that influence driving performance from physiological signals, and then using those estimates to evaluate overall performance.
  approach_bullets:
    - >-
      <strong>Stage 1: Predicting Performance-Shaping Factors:</strong> We extracted features from EEG, ECG, and pulse recordings and trained machine learning (ML) and deep learning (DL) models to predict attention, anxiety, and mental workload. For each factor, we selected the best-performing ML and DL model for each of the three signals, giving six model predictions per factor. We combined these predictions using majority voting to obtain the final estimate.
    - >-
      <strong>Stage 2: Human Performance Evaluation:</strong> We used the predicted attention, anxiety, and mental workload levels as inputs to a second-stage evaluation model. We explored heuristic rules, regression methods, and ML classifiers to derive an overall human performance assessment.
  findings_heading: Key Findings
  findings_bullets:
    - >-
      <strong>Cognitive State Prediction:</strong> The six-model voting ensemble achieved 83.78% accuracy for attention, 91.92% for anxiety, and 84.67% for mental workload.
    - >-
      <strong>Human Performance Evaluation:</strong> The Random Forest classifier achieved 86.4% accuracy in the second stage, compared with 74.8% for linear regression and 81.8% for logistic regression.
  closing_paragraph: >-
    The results showed that EEG, ECG, and pulse signals could be combined to estimate factors influencing driving performance, and that these estimates could then be used to assess overall human performance in simulated driving scenarios.
