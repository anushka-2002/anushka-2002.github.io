  pub: arXiv Preprint
  pub_post: " · Representation Learning Lab, IISc ·"
  pub_date: "2026"
  abstract: >-
    Investigates how to make LLM unlearning provably auditable by model providers while keeping generated outputs indistinguishable against membership-inference attacks, combining a post-unlearning objective (GapWiden) with divergence-guided rejection sampling (GapVeil).
  cover: /assets/images/research-unlearning.png
  hero_image: /assets/images/unlearning-hero.png
  authors:
    - Piyush Tiwary
    - Anushka Srivastava
    - A. P. Prathosh
  links:
    arXiv:
      url: https://arxiv.org/abs/2611.05866
      target: _blank
  paper_url: https://arxiv.org/abs/2611.05866
  paper_button: "[arXiv]"
  detail_metadata: arXiv Preprint, 2026
  problem_heading: "The Problem: A Missing Objective in Machine Unlearning"
  problem_paragraphs:
    - >-
      An effective machine unlearning method must remove target knowledge (<strong>forgetting</strong>), preserve general capabilities (<strong>retention</strong>), and prevent external users from identifying which data was unlearned (<strong>membership-inference resistance</strong>). However, these objectives leave an important question unanswered: how can a model provider establish, through statistical evidence, that the requested knowledge has actually been removed?
    - >-
      We introduce <strong>auditability</strong> as a fourth objective: providing the model provider with statistical evidence that forgetting has occurred. This introduces a fundamental tension. Increasing the statistical difference between the original and unlearned models makes forgetting easier for the provider to verify, but can also make forgotten data easier for external attackers to identify through membership-inference attacks.
    - >-
      Evaluating 11 existing unlearning methods across TOFU, MUSE, and RWKU, we found that none consistently satisfied all four objectives. Methods either lacked reliable auditability, exposed forgotten data to membership-inference attacks, or degraded general model utility.
  insight_heading: "Core Insight: Separate the Provider's View From the User's View"
  insight_paragraph: >-
    By analyzing hidden states, logits, and model outputs, we found that the statistical divergence between the output distributions of the base and unlearned models consistently separates forgotten prompts from retained ones.
  insight_lead: "This creates an opportunity to separate the provider's ability to audit forgetting from an external user's ability to detect it:"
  insight_bullets:
    - >-
      <strong>Provider View (Internal):</strong> The provider has access to both models and can use their statistical divergence as an audit signal.
    - >-
      <strong>User View (External):</strong> Users only observe generated outputs. Decoding-time filtering can therefore conceal the signals that would otherwise expose unlearned data to external attacks.
  approach_heading: "Our Approach: <em>GapWiden</em> + <em>GapVeil</em>"
  approach_bullets:
    - >-
      <strong>GapWiden (Post-Unlearning Objective):</strong> For baselines where forget and retain scores overlap, we apply a lightweight objective to increase their separation. A margin-bounded hinge loss pushes forgotten prompts beyond an audit threshold, while a Huber loss keeps retained prompts anchored near zero. The objective stops pushing once the margin is reached, limiting unnecessary weight changes.
    - >-
      <strong>GapVeil (Divergence-Guided Decoding):</strong> At inference time, we draft candidate responses from the fluent base model, using a short token-suppression warm-up to avoid regenerating forgotten tokens at the start. Candidates scoring in the forget regime are rejected, allowing the system to preserve fluent generation while reducing externally detectable evidence of unlearned data.
  findings_heading: Key Findings
  findings_lead: >-
    Applied as a plug-and-play wrapper across 11 unlearning baselines on TOFU, MUSE, and RWKU, <em>GapWiden</em> and <em>GapVeil</em> bring existing methods closer to a retrained-from-scratch oracle. The following mean scores are across the 11 baselines on TOFU:
  findings_bullets:
    - >-
      Improve mean provider <strong>auditability (AUROC)</strong> from <strong>0.91 to 0.998</strong>.
    - >-
      Improve <strong>membership-inference resistance</strong> from <strong>0.77 to 0.997</strong>.
    - >-
      Achieve <strong>oracle-level forgetting (0.90)</strong> while improving mean <strong>retain utility</strong> from <strong>0.54 to 0.72</strong> across 9 of 11 baselines.
