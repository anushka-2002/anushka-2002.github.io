short_bio: >-
  <p>
    I’m a Software Engineer at Google Cloud, working on large-scale distributed data systems and multi-agent workflows. Working on reliability challenges in both areas has shaped my interest in how complex systems behave, how they can be made more reliable, and how models represent and retain knowledge.
  </p>
  <p>
    My recent research focuses on machine unlearning: removing targeted knowledge from language models while preserving their broader capabilities, and developing ways to statistically verify that the removal has taken place. I completed my B.Tech. (Hons.) in Computer Science and Engineering at IIT Kharagpur in 2024.
  </p>
  <p>
    My broader research interests include large language models, post-training, representation learning, reasoning, and multi-agent systems.
  </p>

